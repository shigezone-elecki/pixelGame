<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Game</title>
</head>
<body style="margin:0; background:black; display:flex; justify-content:center; align-items:center; height:100vh;">
  <!-- スマホのタッチ操作（バーチャルパッド）を有効にするには gamepad="enabled" を指定します -->
  <pyxel-play name="pixelGame.pyxapp" gamepad="enabled"></pyxel-play>

  <!-- Pyxelのプログラム本体を読み込むスクリプト -->
  <script src="https://kitao.dev/pyxel/3.0.1/pyxel.js"></script>
</body>
</html>
