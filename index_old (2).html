<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Game</title>
    <style>
        body {
            margin: 0;
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        /* Pyxelのプレイヤー要素が正方形の比率を保つように強制する */
        pyxel-play {
            aspect-ratio: 1 / 1;
            max-width: 100vw;
            max-height: 100vh;
        }
    </style>
    <!-- PyxelのWebプレイヤー用スクリプト -->
    <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel@main/wasm/pyxel.js"></script>
</head>
<body>

    <!-- バーチャルパッドを有効化してpyxappを読み込む -->
    <pyxel-play name="pixelGame.pyxapp" gamepad="enabled"></pyxel-play>

</body>
</html>
